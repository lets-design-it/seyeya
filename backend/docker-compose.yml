version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seyeya_postgres
    environment:
      POSTGRES_USER: seyeya_user
      POSTGRES_PASSWORD: seyeya_password
      POSTGRES_DB: seyeya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seyeya_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seyeya_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: seyeya_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://seyeya_user:seyeya_password@postgres:5432/seyeya_db
      DATABASE_SYNC_URL: postgresql://seyeya_user:seyeya_password@postgres:5432/seyeya_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      DEBUG: ${DEBUG:-True}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: seyeya_celery
    environment:
      DATABASE_URL: postgresql+asyncpg://seyeya_user:seyeya_password@postgres:5432/seyeya_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    command: celery -A app.tasks.celery_app worker -l info
    restart: unless-stopped

volumes:
  postgres_data:
